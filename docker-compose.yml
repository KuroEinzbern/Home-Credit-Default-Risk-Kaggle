version: '3.9'

services:
  db:
    image: postgres:15
    container_name: applications_db
    restart: always
    environment:
      POSTGRES_DB: applications
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: securepassword
    ports:
      - "5434:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
  ml_flow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: ml_flow_tracking
    volumes:
      - mlflow_data:/mlflow_store
    restart: always
    depends_on:
      - db
    ports:
      - "5000:5000"
    command: >
      sh -c "pip install psycopg2-binary && mlflow server  --host 0.0.0.0  --port 5000  --backend-store-uri postgresql://appuser:securepassword@db:5432/applications --artifacts-destination /mlflow_store"
volumes:
  mlflow_data:
  db_data:
